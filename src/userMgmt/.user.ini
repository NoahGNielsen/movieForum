; Profile pictures may be up to 4 MB (enforced in assets/php/profilePictures.php), but PHP's default
; upload limit is 2 MB. Slightly higher limits here let PHP pass the file on, so the user gets a clear message.
; .user.ini is read when PHP runs as FPM/CGI; Apache blocks web access to it with the dotfile rule in .htaccess.
upload_max_filesize = 5M
post_max_size = 6M
