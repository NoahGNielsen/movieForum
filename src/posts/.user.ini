; A post may have up to 4 images of up to 4 MB each (enforced in assets/php/postImages.php), but PHP's default
; limits are 2 MB per file and 8 MB per request. Slightly higher limits here let PHP pass the files on,
; so the user gets a clear message. See also userMgmt/.user.ini.
upload_max_filesize = 5M
post_max_size = 22M
